name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests before deployment'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Pre-deployment tests (can be skipped for hotfixes)
  pre-deployment-tests:
    name: 'Pre-deployment Tests'
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || !inputs.skip_tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run critical tests
        run: |
          yarn test:unit
          yarn lint
          yarn build

  # Build and push Docker image
  build-and-push:
    name: 'Build & Push Image'
    runs-on: ubuntu-latest
    needs: [pre-deployment-tests]
    if: always() && (needs.pre-deployment-tests.result == 'success' || needs.pre-deployment-tests.result == 'skipped')
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # Deploy to staging
  deploy-staging:
    name: 'Deploy to Staging'
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging-api.yourapp.com
    
    steps:
      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Image: ${{ needs.build-and-push.outputs.image-tag }}"
          echo "Digest: ${{ needs.build-and-push.outputs.image-digest }}"
          
          # Add your deployment commands here
          # Examples:
          # - kubectl apply -f k8s/staging/
          # - helm upgrade --install app ./chart --set image.tag=${{ needs.build-and-push.outputs.image-tag }}
          # - docker-compose -f docker-compose.staging.yml up -d
          
          echo "✅ Staging deployment completed"

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests against staging..."
          
          # Add smoke tests here
          # Examples:
          # - curl -f https://staging-api.yourapp.com/health
          # - yarn test:smoke --baseUrl=https://staging-api.yourapp.com
          
          echo "✅ Smoke tests passed"

      - name: Notify deployment
        if: always()
        run: |
          echo "📢 Staging deployment notification would be sent here"
          # Add notification logic (Slack, Discord, email, etc.)

  # Deploy to production (only on tags or manual trigger)
  deploy-production:
    name: 'Deploy to Production'
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    environment:
      name: production
      url: https://api.yourapp.com
    
    steps:
      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production environment..."
          echo "Image: ${{ needs.build-and-push.outputs.image-tag }}"
          echo "Digest: ${{ needs.build-and-push.outputs.image-digest }}"
          
          # Add your production deployment commands here
          # Examples:
          # - kubectl apply -f k8s/production/
          # - helm upgrade --install app ./chart --set image.tag=${{ needs.build-and-push.outputs.image-tag }}
          # - docker-compose -f docker-compose.production.yml up -d
          
          echo "✅ Production deployment completed"

      - name: Run production smoke tests
        run: |
          echo "🧪 Running smoke tests against production..."
          
          # Add production smoke tests here
          # Examples:
          # - curl -f https://api.yourapp.com/health
          # - yarn test:smoke --baseUrl=https://api.yourapp.com
          
          echo "✅ Production smoke tests passed"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## Changes in this Release
            
            - Deployed to production
            - Image: ${{ needs.build-and-push.outputs.image-tag }}
            - Digest: ${{ needs.build-and-push.outputs.image-digest }}
            
            ## Deployment Information
            
            - **Environment**: Production
            - **Deployed at**: ${{ github.event.head_commit.timestamp }}
            - **Commit**: ${{ github.sha }}
          draft: false
          prerelease: false

      - name: Notify production deployment
        if: always()
        run: |
          echo "📢 Production deployment notification would be sent here"
          # Add notification logic (Slack, Discord, email, etc.)

  # Rollback capability
  rollback:
    name: 'Rollback'
    runs-on: ubuntu-latest
    if: failure() && (needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure')
    needs: [deploy-staging, deploy-production]
    
    steps:
      - name: Rollback deployment
        run: |
          echo "🔄 Rolling back deployment..."
          
          # Add rollback commands here
          # Examples:
          # - kubectl rollout undo deployment/app
          # - helm rollback app
          # - docker-compose -f docker-compose.yml down && docker-compose -f docker-compose.yml up -d
          
          echo "✅ Rollback completed"

      - name: Notify rollback
        run: |
          echo "📢 Rollback notification would be sent here"
          # Add notification logic
